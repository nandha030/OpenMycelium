services:
  openmycelium:
    build: .
    image: openmycelium/developer-edition:local
    user: "0:0"
    env_file:
      - .env
    ports:
      - "8081:8080"
    environment:
      PORT: "8080"
      OLLAMA_BASE_URL: "http://host.docker.internal:11434"
      DATABASE_URL: "postgres://openmycelium:openmycelium@postgres:5432/openmycelium?sslmode=disable"
      NATS_URL: "nats://nats:4222"
    volumes:
      - openmycelium-data:/data
    depends_on:
      postgres:
        condition: service_healthy
      nats:
        condition: service_started
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: openmycelium
      POSTGRES_USER: openmycelium
      POSTGRES_PASSWORD: openmycelium
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U openmycelium -d openmycelium"]
      interval: 5s
      timeout: 3s
      retries: 12
    volumes:
      - postgres-data:/var/lib/postgresql/data
  nats:
    image: nats:2.10-alpine
    command: ["-js", "-sd", "/data"]
    volumes:
      - nats-data:/data
volumes:
  openmycelium-data:
  postgres-data:
  nats-data:
