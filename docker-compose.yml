services:
  openmycelium:
    build: .
    image: openmycelium/developer-edition:local
    user: "0:0"
    env_file:
      - .env
    ports:
      - "8081:8080"
    environment:
      PORT: "8080"
      OPENMYCELIUM_SITE_ID: "${OPENMYCELIUM_SITE_ID:-OM-LOCAL}"
      OLLAMA_BASE_URL: "http://host.docker.internal:11434"
      DATABASE_URL: "postgres://openmycelium:openmycelium@postgres:5432/openmycelium?sslmode=disable"
      NATS_URL: "nats://nats:4222"
      METRICS_TOKEN: "${METRICS_TOKEN:-openmycelium-local-metrics-token}"
      PROMETHEUS_INTERNAL_URL: "http://prometheus:9090"
      PROMETHEUS_PUBLIC_URL: "${PROMETHEUS_PUBLIC_URL:-http://127.0.0.1:9090}"
      GRAFANA_INTERNAL_URL: "http://grafana:3000"
      GRAFANA_PUBLIC_URL: "${GRAFANA_PUBLIC_URL:-http://127.0.0.1:3000}"
      MCCL_COORDINATOR_SERVICE: "mccl-coordinator"
      MCCL_COORDINATOR_PORT: "29500"
    volumes:
      - openmycelium-data:/data
    depends_on:
      postgres:
        condition: service_healthy
      nats:
        condition: service_started
      prometheus:
        condition: service_started
      mccl-coordinator:
        condition: service_started
  mccl-coordinator:
    build:
      context: .
      dockerfile: runtime/mccl/Dockerfile
    image: openmycelium/mccl:0.2.0
    command: ["serve", "--host", "0.0.0.0", "--port", "29500"]
    expose:
      - "29500"
    healthcheck:
      test: ["CMD", "python", "-c", "import socket; socket.create_connection(('127.0.0.1', 29500), 2).close()"]
      interval: 10s
      timeout: 3s
      retries: 6
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: openmycelium
      POSTGRES_USER: openmycelium
      POSTGRES_PASSWORD: openmycelium
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U openmycelium -d openmycelium"]
      interval: 5s
      timeout: 3s
      retries: 12
    volumes:
      - postgres-data:/var/lib/postgresql/data
  nats:
    image: nats:2.10-alpine
    command: ["-js", "-sd", "/data"]
    volumes:
      - nats-data:/data
  prometheus:
    image: prom/prometheus:v3.13.1
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        printf '%s' "$$METRICS_TOKEN" > /tmp/openmycelium-metrics-token
        exec /bin/prometheus \
          --config.file=/etc/prometheus/prometheus.yml \
          --storage.tsdb.path=/prometheus \
          --storage.tsdb.retention.time=15d \
          --web.enable-lifecycle
    environment:
      METRICS_TOKEN: "${METRICS_TOKEN:-openmycelium-local-metrics-token}"
    ports:
      - "9090:9090"
    volumes:
      - ./observability/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./observability/prometheus/alerts.yml:/etc/prometheus/alerts.yml:ro
      - prometheus-data:/prometheus
  grafana:
    image: grafana/grafana:13.1.0
    ports:
      - "3000:3000"
    environment:
      GF_SECURITY_ADMIN_USER: "${GRAFANA_ADMIN_USER:-admin}"
      GF_SECURITY_ADMIN_PASSWORD: "${GRAFANA_ADMIN_PASSWORD:-openmycelium-admin}"
      GF_USERS_ALLOW_SIGN_UP: "false"
      GF_AUTH_ANONYMOUS_ENABLED: "false"
      GF_SERVER_ROOT_URL: "${GRAFANA_PUBLIC_URL:-http://127.0.0.1:3000}"
    volumes:
      - ./observability/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./observability/grafana/dashboards:/var/lib/grafana/dashboards:ro
      - grafana-data:/var/lib/grafana
    depends_on:
      prometheus:
        condition: service_started
volumes:
  openmycelium-data:
  postgres-data:
  nats-data:
  prometheus-data:
  grafana-data:
