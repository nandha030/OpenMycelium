[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "openmycelium-mccl"
version = "0.2.0a2"
description = "Qualified cross-vendor (CUDA<->ROCm) host-staged communication runtime for OpenMycelium"
readme = "README.md"
requires-python = ">=3.9"
license = {text = "Apache-2.0"}
authors = [{name = "OpenMycelium contributors"}]
keywords = [
  "collectives", "distributed", "GPU", "CUDA", "ROCm", "cross-vendor",
  "heterogeneous", "OpenMycelium",
]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Developers",
  "License :: OSI Approved :: Apache Software License",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.9",
  "Programming Language :: Python :: 3.12",
  "Operating System :: POSIX :: Linux",
  "Topic :: System :: Distributed Computing",
]
dependencies = []

[project.optional-dependencies]
# Only needed to run the device-side tests and the pipeline example. The
# transport, framing, and qualification logic import no third-party packages.
torch = ["torch>=2.0", "numpy>=1.24"]

[project.urls]
Homepage = "https://github.com/nandha030/OpenMycelium"
Source = "https://github.com/nandha030/OpenMycelium"

[project.scripts]
mccl = "mccl.cli_mccl:main"
mccl-runtime = "mccl.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
# The native bridge and probe sources ship with the wheel so the deterministic
# build procedure in README.md can be followed from an installed package.
mccl = ["native/*.c", "native/*.sh", "native/*.h"]
