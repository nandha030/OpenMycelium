replicaCount: 1

image:
  repository: ghcr.io/nandha030/openmycelium
  tag: latest
  pullPolicy: IfNotPresent

service:
  type: ClusterIP
  port: 8080

config:
  authMode: local
  cookieSecure: true
  ollamaBaseUrl: http://ollama.openmycelium.svc.cluster.local:11434

secrets:
  databaseUrl: ""
  natsUrl: ""
  bootstrapAdminEmail: ""
  bootstrapAdminPassword: ""
  metricsToken: ""

resources:
  requests:
    cpu: 100m
    memory: 128Mi
  limits:
    cpu: "1"
    memory: 512Mi

podAnnotations: {}

networkPolicy:
  enabled: true
