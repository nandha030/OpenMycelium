replicaCount: 1

image:
  repository: ghcr.io/nandha030/openmycelium
  tag: latest
  pullPolicy: IfNotPresent

service:
  type: ClusterIP
  port: 8080

config:
  authMode: local
  cookieSecure: true
  ollamaBaseUrl: http://ollama.openmycelium.svc.cluster.local:11434

hetccl:
  enabled: true
  image:
    repository: openmycelium/hetccl
    tag: 0.1.0
    pullPolicy: IfNotPresent
  port: 29500
  timeoutSeconds: 120
  resources:
    requests:
      cpu: 250m
      memory: 256Mi
    limits:
      memory: 2Gi

secrets:
  databaseUrl: ""
  natsUrl: ""
  bootstrapAdminEmail: ""
  bootstrapAdminPassword: ""
  clusterCredentialKey: ""
  metricsToken: ""
  agentToken: ""

resources:
  requests:
    cpu: 100m
    memory: 128Mi
  limits:
    cpu: "1"
    memory: 512Mi

podAnnotations: {}

networkPolicy:
  enabled: true
