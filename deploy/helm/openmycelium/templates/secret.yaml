apiVersion: v1
kind: Secret
metadata:
  name: {{ include "openmycelium.fullname" . }}
  labels:
    {{- include "openmycelium.labels" . | nindent 4 }}
type: Opaque
stringData:
  DATABASE_URL: {{ required "secrets.databaseUrl is required" .Values.secrets.databaseUrl | quote }}
  NATS_URL: {{ required "secrets.natsUrl is required" .Values.secrets.natsUrl | quote }}
  BOOTSTRAP_ADMIN_EMAIL: {{ required "secrets.bootstrapAdminEmail is required" .Values.secrets.bootstrapAdminEmail | quote }}
  BOOTSTRAP_ADMIN_PASSWORD: {{ required "secrets.bootstrapAdminPassword is required" .Values.secrets.bootstrapAdminPassword | quote }}
  METRICS_TOKEN: {{ required "secrets.metricsToken is required" .Values.secrets.metricsToken | quote }}
