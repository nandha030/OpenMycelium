apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "openmycelium.fullname" . }}
  labels:
    {{- include "openmycelium.labels" . | nindent 4 }}
spec:
  replicas: {{ .Values.replicaCount }}
  selector:
    matchLabels:
      app.kubernetes.io/name: {{ include "openmycelium.name" . }}
      app.kubernetes.io/instance: {{ .Release.Name }}
  template:
    metadata:
      labels:
        {{- include "openmycelium.labels" . | nindent 8 }}
      {{- with .Values.podAnnotations }}
      annotations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
    spec:
      securityContext:
        runAsNonRoot: true
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: control-plane
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          env:
            - name: PORT
              value: "8080"
            - name: STATE_PATH
              value: /tmp/openmycelium-state.json
            - name: AUTH_MODE
              value: {{ .Values.config.authMode | quote }}
            - name: COOKIE_SECURE
              value: {{ .Values.config.cookieSecure | quote }}
            - name: OLLAMA_BASE_URL
              value: {{ .Values.config.ollamaBaseUrl | quote }}
            {{- if .Values.mccl.enabled }}
            - name: MCCL_COORDINATOR_SERVICE
              value: "{{ include "openmycelium.fullname" . }}-mccl.{{ .Release.Namespace }}.svc.cluster.local"
            - name: MCCL_COORDINATOR_PORT
              value: {{ .Values.mccl.port | quote }}
            {{- end }}
          envFrom:
            - secretRef:
                name: {{ include "openmycelium.fullname" . }}
          ports:
            - name: http
              containerPort: 8080
          readinessProbe:
            httpGet:
              path: /api/v1/ready
              port: http
            initialDelaySeconds: 3
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /api/v1/health
              port: http
            initialDelaySeconds: 10
            periodSeconds: 20
          resources:
            {{- toYaml .Values.resources | nindent 12 }}
          volumeMounts:
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: tmp
          emptyDir: {}
