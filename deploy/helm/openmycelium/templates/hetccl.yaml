{{- if .Values.hetccl.enabled }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "openmycelium.fullname" . }}-hetccl
  labels:
    {{- include "openmycelium.labels" . | nindent 4 }}
    app.kubernetes.io/component: collective-coordinator
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: {{ include "openmycelium.name" . }}-hetccl
      app.kubernetes.io/instance: {{ .Release.Name }}
  template:
    metadata:
      labels:
        app.kubernetes.io/name: {{ include "openmycelium.name" . }}-hetccl
        app.kubernetes.io/instance: {{ .Release.Name }}
        app.kubernetes.io/component: collective-coordinator
    spec:
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: coordinator
          image: "{{ .Values.hetccl.image.repository }}:{{ .Values.hetccl.image.tag }}"
          imagePullPolicy: {{ .Values.hetccl.image.pullPolicy }}
          args:
            - serve
            - --host
            - 0.0.0.0
            - --port
            - {{ .Values.hetccl.port | quote }}
            - --timeout
            - {{ .Values.hetccl.timeoutSeconds | quote }}
          ports:
            - name: collective
              containerPort: {{ .Values.hetccl.port }}
          readinessProbe:
            tcpSocket:
              port: collective
            initialDelaySeconds: 2
            periodSeconds: 5
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          resources:
            {{- toYaml .Values.hetccl.resources | nindent 12 }}
---
apiVersion: v1
kind: Service
metadata:
  name: {{ include "openmycelium.fullname" . }}-hetccl
  labels:
    {{- include "openmycelium.labels" . | nindent 4 }}
    app.kubernetes.io/component: collective-coordinator
spec:
  selector:
    app.kubernetes.io/name: {{ include "openmycelium.name" . }}-hetccl
    app.kubernetes.io/instance: {{ .Release.Name }}
  ports:
    - name: collective
      port: {{ .Values.hetccl.port }}
      targetPort: collective
{{- end }}
