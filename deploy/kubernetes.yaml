apiVersion: v1
kind: Namespace
metadata:
  name: openmycelium
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: control-plane
  namespace: openmycelium
spec:
  replicas: 1
  selector:
    matchLabels: { app: openmycelium }
  template:
    metadata:
      labels: { app: openmycelium }
    spec:
      containers:
        - name: control-plane
          image: openmycelium/developer-edition:local
          imagePullPolicy: IfNotPresent
          ports: [{ containerPort: 8080 }]
          readinessProbe: { httpGet: { path: /api/v1/health, port: 8080 } }
          securityContext: { allowPrivilegeEscalation: false, readOnlyRootFilesystem: true }
---
apiVersion: v1
kind: Service
metadata:
  name: control-plane
  namespace: openmycelium
spec:
  selector: { app: openmycelium }
  ports: [{ port: 8080, targetPort: 8080 }]
