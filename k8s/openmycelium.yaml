apiVersion: v1
kind: Namespace
metadata:
  name: openmycelium
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: discovery-agent
  namespace: openmycelium
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: openmycelium-discovery-reader
rules:
  - apiGroups: [""]
    resources: ["nodes", "pods"]
    verbs: ["get", "list", "watch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: openmycelium-discovery-reader
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: openmycelium-discovery-reader
subjects:
  - kind: ServiceAccount
    name: discovery-agent
    namespace: openmycelium
---
apiVersion: apps/v1
kind: DaemonSet
metadata:
  name: discovery-agent
  namespace: openmycelium
spec:
  selector:
    matchLabels:
      app: openmycelium-discovery
  template:
    metadata:
      labels:
        app: openmycelium-discovery
    spec:
      serviceAccountName: discovery-agent
      containers:
        - name: discovery-agent
          image: ghcr.io/nandha030/openmycelium-agent:0.1.0
          imagePullPolicy: IfNotPresent
          command: ["python", "-c", "import time; time.sleep(3600)"]
          securityContext:
            readOnlyRootFilesystem: true
            allowPrivilegeEscalation: false
